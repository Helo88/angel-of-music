<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes aomTopGlow{0%,100%{opacity:.35}50%{opacity:.85}}</style>
</helmet>
<div ref="{{ hostRef }}" style="position:relative;height:0;z-index:80;pointer-events:none">
  <div onClick="{{ toTop }}" title="Back to the top" style="position:absolute;right:26px;bottom:0;width:54px;height:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:{{ pe }};opacity:{{ vis }};transform:{{ shift }};transition:opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1)">
    <div style="position:absolute;inset:-10px;border-radius:999px;background:radial-gradient(circle,{{ glow }},transparent 70%);animation:aomTopGlow 5s ease-in-out infinite"></div>
    <div style="position:absolute;inset:0;border-radius:999px;border:1px solid {{ rule }};background:linear-gradient(180deg,rgba(28,24,21,.92),rgba(16,14,11,.92));backdrop-filter:blur(6px)"></div>
    <svg width="54" height="54" viewBox="0 0 54 54" style="position:relative;overflow:visible">
      <circle cx="27" cy="27" r="20.5" fill="none" stroke="{{ accent }}" stroke-opacity=".22" stroke-dasharray="1 5" stroke-linecap="round"></circle>
      <path d="M27 12 L30.4 15.4 L27 18.8 L23.6 15.4 Z" fill="{{ accent }}"></path>
      <path d="M27 19.6 L27 40" stroke="{{ accent }}" stroke-width="1.1" stroke-linecap="round"></path>
      <path d="M18.6 27.4 C22 25.6 25.2 22.9 27 19.8 C28.8 22.9 32 25.6 35.4 27.4" fill="none" stroke="{{ accent }}" stroke-width="1.1" stroke-linecap="round"></path>
      <path d="M21.4 33.6 C24 32.2 26 30.4 27 28.6 C28 30.4 30 32.2 32.6 33.6" fill="none" stroke="{{ accent }}" stroke-width=".9" stroke-opacity=".55" stroke-linecap="round"></path>
      <circle cx="27" cy="41.6" r="1.3" fill="{{ accent }}"></circle>
    </svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:120},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;house&quot;,&quot;phantom&quot;,&quot;lesmis&quot;,&quot;cats&quot;],&quot;default&quot;:&quot;house&quot;,&quot;tsType&quot;:&quot;'house' | 'phantom' | 'lesmis' | 'cats'&quot;}}">
class Component extends DCLogic {
  state = { show: false };
  componentDidMount() {
    this.hostRef = this.hostRef || null;
    this.onScroll = () => {
      const sc = this.scroller;
      if (!sc) return;
      const y = sc === document ? window.scrollY : sc.scrollTop;
      const show = y > 260;
      if (show !== this.state.show) this.setState({ show });
    };
    setTimeout(() => {
      let n = this.node && this.node.parentElement;
      while (n) {
        const oy = getComputedStyle(n).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 4) break;
        n = n.parentElement;
      }
      this.scroller = n || document;
      const target = this.scroller === document ? window : this.scroller;
      target.addEventListener('scroll', this.onScroll, { passive: true });
      this.target = target;
      this.onScroll();
    }, 60);
  }
  componentWillUnmount() { if (this.target) this.target.removeEventListener('scroll', this.onScroll); }
  renderVals() {
    const themes = {
      house: { accent: '#D9C9A3', rule: 'rgba(217,201,163,.32)', glow: 'rgba(217,201,163,.16)' },
      phantom: { accent: '#C9CFDD', rule: 'rgba(201,207,221,.32)', glow: 'rgba(201,207,221,.16)' },
      lesmis: { accent: '#C94B5E', rule: 'rgba(201,75,94,.32)', glow: 'rgba(201,75,94,.16)' },
      cats: { accent: '#D9A441', rule: 'rgba(217,164,65,.32)', glow: 'rgba(217,164,65,.16)' }
    };
    const t = themes[this.props.theme] || themes.house;
    const s = this.state.show;
    return {
      accent: t.accent, rule: t.rule, glow: t.glow,
      vis: s ? 1 : 0,
      pe: s ? 'auto' : 'none',
      shift: s ? 'none' : 'translateY(14px)',
      hostRef: el => { this.node = el; },
      toTop: () => {
        const sc = this.scroller;
        if (!sc) return;
        if (sc === document) window.scrollTo({ top: 0, behavior: 'smooth' });
        else sc.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
  }
}
</script>
</body>
</html>
