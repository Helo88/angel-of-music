<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,400;1,500&amp;family=Inter:wght@300;400;500;600&amp;family=Cinzel:wght@400;500&amp;family=Cinzel+Decorative:wght@700&amp;display=swap" rel="stylesheet" />
<style>
@keyframes aomRays{to{transform:rotate(360deg)}}
@keyframes aomTwinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@container (max-width: 620px){
  [data-au="wrap"]{padding:26px 14px !important}
  [data-au="card"]{max-width:100% !important}
  [data-au="body"]{padding:36px 24px 28px !important}
}
</style>
</helmet>
<div style="container-type:inline-size;min-height:100%;background:radial-gradient(ellipse 700px 420px at 50% 0%,rgba(217,201,163,.08),transparent 65%),#100E0B;color:#F5F0E8;font-family:'Inter',sans-serif;font-weight:300">
  <dc-import name="SiteNav" style="position:sticky;top:0;z-index:95" onNavigate="{{ onNavigate }}" frameHeight="{{ frameHeight }}" hint-size="100%,96px"></dc-import>

  <div data-au="wrap" style="display:flex;align-items:center;justify-content:center;padding:70px 20px 90px">
    <div data-au="card" style="position:relative;width:100%;max-width:440px">
      <svg width="0" height="0" style="position:absolute">
        <filter id="aomDeckleAuth"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="7" result="n" /><feDisplacementMap in="SourceGraphic" in2="n" scale="9" /></filter>
      </svg>
      <div style="position:absolute;inset:0;filter:url(#aomDeckleAuth) drop-shadow(0 30px 70px rgba(0,0,0,.65));background:linear-gradient(165deg,#221c14 0%,#171008 55%,#0d0906 100%);border:1px solid rgba(217,201,163,.35)"></div>
      <div style="position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0deg,rgba(217,201,163,.14) 55deg,transparent 130deg,rgba(217,201,163,.1) 210deg,transparent 300deg);animation:aomRays 20s linear infinite;pointer-events:none"></div>

      <div data-au="body" style="position:relative;padding:44px 40px 36px">
        <div style="position:absolute;inset:12px;border:1px solid rgba(217,201,163,.16);pointer-events:none"></div>
        <div style="position:absolute;width:16px;height:16px;top:12px;left:12px;border-top:2px solid #D9C9A3;border-left:2px solid #D9C9A3"></div>
        <div style="position:absolute;width:16px;height:16px;top:12px;right:12px;border-top:2px solid #D9C9A3;border-right:2px solid #D9C9A3"></div>
        <div style="position:absolute;width:16px;height:16px;bottom:12px;left:12px;border-bottom:2px solid #D9C9A3;border-left:2px solid #D9C9A3"></div>
        <div style="position:absolute;width:16px;height:16px;bottom:12px;right:12px;border-bottom:2px solid #D9C9A3;border-right:2px solid #D9C9A3"></div>

        <span style="position:absolute;top:22px;left:26px;width:26px;height:26px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#E4D6AE,#8a6f3a 70%);box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:11px;color:#171204">✦</span>
        <span style="position:absolute;top:56px;left:40px;font-size:12px;color:#D9C9A3;animation:aomTwinkle 2.6s ease-in-out infinite">✦</span>
        <span style="position:absolute;top:30px;right:56px;font-size:10px;color:#D9C9A3;animation:aomTwinkle 2.6s ease-in-out infinite .5s">✦</span>

        <div style="position:relative;text-align:center;margin-bottom:26px">
          <span style="font-size:9px;letter-spacing:4px;color:#D9C9A3;text-transform:uppercase">The Angel Beckons</span>
          <h2 style="font-family:'Playfair Display',serif;font-weight:600;font-size:25px;color:#F5F0E8;margin:8px 0 0">{{ heading }}</h2>
        </div>

        <div style="position:relative;display:flex;border:1px solid rgba(217,201,163,.28);border-radius:999px;padding:3px;margin-bottom:26px">
          <span onClick="{{ pickIn }}" style="flex:1;text-align:center;padding:9px 0;font:500 10.5px 'Inter',sans-serif;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;border-radius:999px;background:{{ inBg }};color:{{ inColor }};transition:.25s">Sign in</span>
          <span onClick="{{ pickUp }}" style="flex:1;text-align:center;padding:9px 0;font:500 10.5px 'Inter',sans-serif;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;border-radius:999px;background:{{ upBg }};color:{{ upColor }};transition:.25s">Sign up</span>
        </div>

        <div style="position:relative;display:flex;flex-direction:column;gap:14px">
          <sc-if value="{{ isSignUp }}" hint-placeholder-val="{{ false }}">
            <label style="display:flex;flex-direction:column;gap:6px">
              <span style="font-size:9.5px;letter-spacing:2px;color:#8d8579;text-transform:uppercase">Name</span>
              <input type="text" placeholder="Christine Daaé" style="background:rgba(0,0,0,.25);border:1px solid rgba(217,201,163,.25);border-radius:4px;padding:12px 14px;color:#F5F0E8;font:400 13px 'Inter',sans-serif;outline:none" />
            </label>
          </sc-if>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:9.5px;letter-spacing:2px;color:#8d8579;text-transform:uppercase">Email</span>
            <input type="email" placeholder="you@operahouse.com" style="background:rgba(0,0,0,.25);border:1px solid rgba(217,201,163,.25);border-radius:4px;padding:12px 14px;color:#F5F0E8;font:400 13px 'Inter',sans-serif;outline:none" />
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:9.5px;letter-spacing:2px;color:#8d8579;text-transform:uppercase">Password</span>
            <input type="password" placeholder="••••••••••" style="background:rgba(0,0,0,.25);border:1px solid rgba(217,201,163,.25);border-radius:4px;padding:12px 14px;color:#F5F0E8;font:400 13px 'Inter',sans-serif;outline:none" />
          </label>

          <sc-if value="{{ isSignIn }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;justify-content:flex-end;margin-top:-4px">
              <span style="font-size:10.5px;color:#8d8579;cursor:pointer" style-hover="color:#D9C9A3">Forgot password?</span>
            </div>
          </sc-if>

          <a onClick="{{ submit }}" style="display:flex;align-items:center;justify-content:center;margin-top:6px;padding:14px;font:500 11px 'Inter',sans-serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:3px;background:linear-gradient(135deg,#E4D6AE,#B79B62);color:#171204">{{ ctaLabel }}</a>

          <p style="text-align:center;font-size:11px;color:#8d8579;margin:14px 0 0;font-style:italic">"{{ tagline }}"</p>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(page: string) =&gt; void&quot;},&quot;frameHeight&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mode: 'in' };
  renderVals() {
    const isIn = this.state.mode === 'in';
    return {
      onNavigate: this.props.onNavigate,
      frameHeight: this.props.frameHeight ?? '100vh',
      isSignIn: isIn,
      isSignUp: !isIn,
      heading: isIn ? 'Welcome back, patron' : 'Join the audience',
      inBg: isIn ? 'linear-gradient(135deg,#E4D6AE,#B79B62)' : 'none',
      inColor: isIn ? '#171204' : '#8d8579',
      upBg: !isIn ? 'linear-gradient(135deg,#E4D6AE,#B79B62)' : 'none',
      upColor: !isIn ? '#171204' : '#8d8579',
      pickIn: () => this.setState({ mode: 'in' }),
      pickUp: () => this.setState({ mode: 'up' }),
      ctaLabel: isIn ? 'Enter the house' : 'Claim your seat',
      tagline: isIn ? 'Your box awaits, as it always has.' : 'Every legend needs an audience.',
      submit: () => { if (this.props.onNavigate) this.props.onNavigate('landing'); }
    };
  }
}

</script>
</body>
</html>
