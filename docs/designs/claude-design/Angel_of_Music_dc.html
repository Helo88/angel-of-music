<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,400;1,500&amp;family=Inter:wght@300;400;500;600&amp;family=Cinzel:wght@400;500&amp;family=Cinzel+Decorative:wght@700&amp;display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0a0908}
  a{color:#D9C9A3}
  a:hover{color:#F7EFD9}
  [data-frame]{container-type:inline-size}
  [data-frame]::-webkit-scrollbar{width:8px;height:8px}
  [data-frame]::-webkit-scrollbar-thumb{background:#2a241e;border-radius:8px}
  [data-am="rail"]::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="min-height:100vh;background:#0a0908;color:#F5F0E8;font-family:'Inter',sans-serif;font-weight:300">
  <div style="position:sticky;top:0;z-index:200;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:rgba(10,9,8,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(217,201,163,.2)">
    <span style="font:500 10px 'Inter',sans-serif;letter-spacing:3px;color:#6d675d;text-transform:uppercase;margin-right:6px">Screen</span>
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="2">
      <button onClick="{{ s.pick }}" style="display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;background:{{ s.bg }};border:1px solid {{ s.border }};color:{{ s.color }};font:500 11px 'Inter',sans-serif;letter-spacing:2px;text-transform:uppercase;padding:9px 16px;cursor:pointer;border-radius:999px">{{ s.label }}</button>
    </sc-for>
    <span style="font-size:11px;letter-spacing:2px;color:#4d4842;text-transform:uppercase;margin-left:6px">04–17 to follow</span>
    <span style="margin-left:auto;font-size:11px;letter-spacing:2px;color:#6d675d;text-transform:uppercase">Desktop 1440 · Tablet 834 · Mobile 390</span>
  </div>

  <div style="display:flex;gap:34px;align-items:flex-start;padding:34px 34px 60px;overflow-x:auto;scrollbar-width:none" data-am="rail">
    <div style="flex:none">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-left:2px">
        <span style="font-family:'Playfair Display',serif;font-size:15px;color:#D9C9A3">Desktop</span>
        <span style="font:400 10px ui-monospace,monospace;letter-spacing:1px;color:#6d675d">1440 × 940</span>
      </div>
      <div data-frame="desktop" style="width:1440px;height:940px;overflow:auto;border:1px solid #2a241e;border-radius:16px;background:#100E0B;box-shadow:0 30px 80px rgba(0,0,0,.6)">
        <sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
          <dc-import name="Landing" frameHeight="940px" hint-size="100%,1600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isArchive }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Archive" frameHeight="940px" hint-size="100%,1400px"></dc-import>
        </sc-if>
        <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Musical Detail" frameHeight="940px" hint-size="100%,1600px"></dc-import>
        </sc-if>
      </div>
    </div>

    <div style="flex:none">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-left:2px">
        <span style="font-family:'Playfair Display',serif;font-size:15px;color:#D9C9A3">Tablet</span>
        <span style="font:400 10px ui-monospace,monospace;letter-spacing:1px;color:#6d675d">834 × 940</span>
      </div>
      <div data-frame="tablet" style="width:834px;height:940px;overflow:auto;border:1px solid #2a241e;border-radius:16px;background:#100E0B;box-shadow:0 30px 80px rgba(0,0,0,.6)">
        <sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
          <dc-import name="Landing" frameHeight="940px" hint-size="100%,1600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isArchive }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Archive" frameHeight="940px" hint-size="100%,1400px"></dc-import>
        </sc-if>
        <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Musical Detail" frameHeight="940px" hint-size="100%,1600px"></dc-import>
        </sc-if>
      </div>
    </div>

    <div style="flex:none">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-left:2px">
        <span style="font-family:'Playfair Display',serif;font-size:15px;color:#D9C9A3">Mobile</span>
        <span style="font:400 10px ui-monospace,monospace;letter-spacing:1px;color:#6d675d">390 × 940</span>
      </div>
      <div data-frame="mobile" style="width:390px;height:940px;overflow:auto;border:1px solid #2a241e;border-radius:16px;background:#100E0B;box-shadow:0 30px 80px rgba(0,0,0,.6)">
        <sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
          <dc-import name="Landing" frameHeight="940px" hint-size="100%,1600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isArchive }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Archive" frameHeight="940px" hint-size="100%,1400px"></dc-import>
        </sc-if>
        <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Musical Detail" frameHeight="940px" hint-size="100%,1600px"></dc-import>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { screen: 'a' };
  renderVals() {
    const defs = [
      { id: 'a', label: '01 · Landing' },
      { id: 'archive', label: '02 · Archive' },
      { id: 'detail', label: '03 · Phantom' }
    ];
    const cur = this.state.screen;
    return {
      isA: cur === 'a',
      isArchive: cur === 'archive',
      isDetail: cur === 'detail',
      screens: defs.map(d => ({
        label: d.label,
        bg: cur === d.id ? 'rgba(217,201,163,.14)' : 'none',
        border: cur === d.id ? 'rgba(217,201,163,.55)' : 'rgba(217,201,163,.2)',
        color: cur === d.id ? '#F7EFD9' : '#8d8579',
        pick: () => this.setState({ screen: d.id })
      }))
    };
  }
}
</script>
</body>
</html>
